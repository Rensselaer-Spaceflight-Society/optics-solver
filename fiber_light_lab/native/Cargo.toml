[package]
name = "fiber_light_lab"
version = "0.2.0"
edition = "2024"
description = "Fiber Light Lab: halogen / GH4001 fiber / LB1092 lens / goniometer reflectance simulator"
license = "MIT"
publish = false
default-run = "FiberLightLab"

[lib]
name = "fiber_light_lab"
path = "src/lib.rs"

[[bin]]
name = "FiberLightLab"
path = "src/main.rs"

[[bin]]
name = "fiberlab-cli"
path = "src/bin/fiberlab_cli.rs"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wgpu", "wayland", "x11", "links"] }
egui_plot = "0.37.0"
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Physics tests are slow without optimization.
[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
